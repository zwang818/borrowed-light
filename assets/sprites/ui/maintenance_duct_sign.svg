  <path d="M1090 566V464Q1090 414 1140 414H1170" fill="none" stroke="#101a20" stroke-width="82" stroke-linejoin="round"/>
  <path d="M1090 566V464Q1090 414 1140 414H1170" fill="none" stroke="url(#steel)" stroke-width="58" stroke-linejoin="round"/>
