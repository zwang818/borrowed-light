<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#18262d"/><stop offset=".14" stop-color="#778b8d"/><stop offset=".25" stop-color="#c2c9b8"/><stop offset=".36" stop-color="#52666d"/><stop offset=".64" stop-color="#273a42"/><stop offset=".78" stop-color="#9ba9a2"/><stop offset=".9" stop-color="#46585d"/><stop offset="1" stop-color="#17262c"/>
